<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaf Color & Health Detector</title>
  <!-- TensorFlow & Teachable Machine CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@1.3.1/dist/teachablemachine-image.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: #1e1e1e; border-radius: 16px; padding: 24px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 6px; color: #fff; }
    p.subtitle { text-align: center; font-size: 0.85rem; color: #a0a0a0; margin-bottom: 20px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background-color: #2c2c2c; color: #a0a0a0; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background-color: #2e7d32; color: #ffffff; }

    .input-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .custom-file-upload { padding: 12px 24px; cursor: pointer; background-color: #2196f3; color: white; border-radius: 8px; font-weight: 600; margin-bottom: 16px; }
    input[type="file"] { display: none; }
    
    #preview-container { width: 100%; height: 260px; background-color: #121212; border: 2px dashed #333; border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #preview-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; display: none; }
    #webcam-container { display: none; width: 100%; height: 260px; background-color: #121212; border-radius: 12px; overflow: hidden; justify-content: center; align-items: center; }

    .status-banner { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-weight: bold; text-align: center; background-color: #2a2a2a; color: #4caf50; border: 1px solid #333; }
    
    .bar-wrapper { margin-bottom: 12px; }
    .bar-info { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
    .progress-bg { background-color: #2c2c2c; border-radius: 6px; height: 10px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background-color: #4caf50; border-radius: 6px; transition: width 0.3s ease; }

    .recommendation-box { background-color: #282828; border-left: 4px solid #2196f3; border-radius: 8px; padding: 14px; font-size: 0.88rem; line-height: 1.4; margin-top: 15px; }
    .recommendation-box h3 { font-size: 0.95rem; color: #fff; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌿 Leaf Color & Health Detector</h1>
    <p class="subtitle">AI Precision Agriculture Scouting</p>

    <div class="tabs">
      <button class="tab-btn active" id="btn-upload" onclick="setMode('upload')">📁 Upload Photo</button>
      <button class="tab-btn" id="btn-webcam" onclick="setMode('webcam')">📷 Live Camera</button>
    </div>

    <!-- Upload Mode -->
    <div id="upload-mode" class="input-section">
      <label for="image-input" class="custom-file-upload">Choose Leaf Photo</label>
      <input type="file" id="image-input" accept="image/*" onchange="processImage(event)">
      <div id="preview-container">
        <span id="placeholder-text" style="color: #666;">No image selected</span>
        <img id="preview-img" alt="Leaf Preview">
      </div>
    </div>

    <!-- Webcam Mode -->
    <div id="webcam-mode" class="input-section" style="display: none;">
      <div id="webcam-container"></div>
    </div>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner">Ready for Inspection</div>

    <!-- Prediction Results -->
    <div id="label-container">
      <div class="bar-wrapper">
        <div class="bar-info"><span id="class-0">Green</span><span id="percent-0">0%</span></div>
        <div class="progress-bg"><div id="fill-0" class="progress-fill" style="width:0%; background-color:#4caf50;"></div></div>
      </div>
      <div class="bar-wrapper">
        <div class="bar-info"><span id="class-1">Yellowing</span><span id="percent-1">0%</span></div>
        <div class="progress-bg"><div id="fill-1" class="progress-fill" style="width:0%; background-color:#fbc02d;"></div></div>
      </div>
      <div class="bar-wrapper">
        <div class="bar-info"><span id="class-2">Brown / Discolored</span><span id="percent-2">0%</span></div>
        <div class="progress-bg"><div id="fill-2" class="progress-fill" style="width:0%; background-color:#ef5350;"></div></div>
      </div>
    </div>

    <div class="recommendation-box">
      <h3>📋 Field Action Plan</h3>
      <p id="rec-text">Select or scan an image to generate diagnostic suggestions.</p>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/r-r5PfMeI/";
    let model, webcam, isWebcamOn = false;

    async function loadModel() {
      if (!model) {
        document.getElementById("status-banner").innerText = "⌛ Loading AI Model...";
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        document.getElementById("status-banner").innerText = "System Ready";
      }
    }

    async function setMode(mode) {
      await loadModel();
      if (mode === 'upload') {
        document.getElementById("upload-mode").style.display = "flex";
        document.getElementById("webcam-mode").style.display = "none";
        document.getElementById("btn-upload").classList.add("active");
        document.getElementById("btn-webcam").classList.remove("active");
        stopWebcam();
      } else {
        document.getElementById("upload-mode").style.display = "none";
        document.getElementById("webcam-mode").style.display = "flex";
        document.getElementById("btn-webcam").classList.add("active");
        document.getElementById("btn-upload").classList.remove("active");
        startWebcam();
      }
    }

    async function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      await loadModel();

      const img = document.getElementById("preview-img");
      const placeholder = document.getElementById("placeholder-text");

      img.src = URL.createObjectURL(file);
      img.style.display = "block";
      placeholder.style.display = "none";

      img.onload = async () => {
        await runPrediction(img);
      };
    }

    async function startWebcam() {
      if (!isWebcamOn) {
        try {
          webcam = new tmImage.Webcam(260, 260, true);
          await webcam.setup();
          await webcam.play();
          isWebcamOn = true;

          const container = document.getElementById("webcam-container");
          container.innerHTML = "";
          container.appendChild(webcam.canvas);
          container.style.display = "flex";

          window.requestAnimationFrame(webcamLoop);
        } catch (e) {
          alert("Unable to open camera. Please check camera permissions.");
        }
      }
    }

    function stopWebcam() {
      if (webcam && isWebcamOn) {
        webcam.stop();
        isWebcamOn = false;
        document.getElementById("webcam-container").style.display = "none";
      }
    }

    async function webcamLoop() {
      if (isWebcamOn) {
        webcam.update();
        await runPrediction(webcam.canvas);
        window.requestAnimationFrame(webcamLoop);
      }
    }

    async function runPrediction(imageSource) {
      if (!model) return;
      const predictions = await model.predict(imageSource);
      let highestProb = 0;
      let topLabel = "";

      predictions.forEach((p, idx) => {
        const percent = Math.round(p.probability * 100);
        if (p.probability > highestProb) {
          highestProb = p.probability;
          topLabel = p.className;
        }

        if (document.getElementById(`class-${idx}`)) {
          document.getElementById(`class-${idx}`).innerText = p.className;
          document.getElementById(`percent-${idx}`).innerText = percent + "%";
          document.getElementById(`fill-${idx}`).style.width = percent + "%";
        }
      });

      // Update banner & recommendation
      const banner = document.getElementById("status-banner");
      const rec = document.getElementById("rec-text");

      if (topLabel === "Green") {
        banner.innerText = "🟢 STATUS: HEALTHY CROP";
        rec.innerHTML = "Chlorophyll levels optimal. Maintain standard watering schedule.";
      } else if (topLabel.includes("Yellow")) {
        banner.innerText = "🟡 STATUS: ATTENTION REQUIRED";
        rec.innerHTML = "Possible Nitrogen deficiency or overwatering. Check soil moisture.";
      } else {
        banner.innerText = "🔴 STATUS: HIGH RISK / STRESSED";
        rec.innerHTML = "Fungal infection or tissue stress detected. Inspect for disease/blight.";
      }
    }

    // Pre-load model on open
    window.onload = loadModel;
  </script>
</body>
</html>
